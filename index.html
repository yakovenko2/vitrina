<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вітрина товарів</title>
<script>
  (function () {
    var host = String(window.location.hostname || "").toLowerCase();
    var landingHosts = {
      "www.vitryna-shop.com": true,
      "vitryna-shop.com": true,
      "www.vitrina-shop.com": true,
      "vitrina-shop.com": true
    };

    if (!landingHosts[host]) return;

    var path = String(window.location.pathname || "/");
    var isStorefrontRoot = path === "/" || path.endsWith("/index.html");
    if (!isStorefrontRoot) return;

    var target = new URL("landing.html", window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.toString());
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260731c">
</head>
<body>
  <main class="card">

    <!-- Профіль -->
    <section class="profile">
      <img class="avatar is-empty" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Аватар магазину">
      <h1 class="name">Магазин</h1>
      <p class="description">
        Власник магазину ще не заповнив інформацію профілю.
      </p>

      <div class="socials" style="display:none">
        <a href="#" class="social-btn" aria-label="Instagram" data-social="instagram">
          <img src="image/insta.png" alt="Instagram" loading="lazy">
        </a>
        <a href="#" class="social-btn" aria-label="Facebook" data-social="facebook">
          <img src="image/facebook.png" alt="Facebook" loading="lazy">
        </a>
        <a href="#" class="social-btn" aria-label="Telegram" data-social="telegram">
          <img src="image/telegram.png" alt="Telegram" loading="lazy">
        </a>
        <a href="#" class="social-btn" aria-label="TikTok" data-social="tiktok">
          <img src="image/tik-tok.png" alt="TikTok" loading="lazy">
        </a>
      </div>

    </section>

    <p id="storeOrderStatusBadge" class="store-order-status" hidden>
      <span class="store-order-status-dot" aria-hidden="true"></span>
      Магазин тимчасово не приймає замовлення
    </p>

    <!-- Категорії -->
    <nav class="categories" aria-label="Категорії товарів"></nav>

    <!-- Товари -->
    <section class="products" id="productsGrid"></section>

    <button class="cart-fab" id="openCartBtn" type="button" aria-label="Відкрити кошик">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2 3h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 7H5.2"/></svg>
      <span class="cart-fab-badge" id="cartCountBadge">0</span>
    </button>

    <div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>
    <aside class="cart-drawer" id="cartDrawer" aria-hidden="true" aria-label="Кошик">
      <div class="cart-head">
        <h2>Кошик</h2>
        <button class="cart-close" id="closeCartBtn" type="button" aria-label="Закрити кошик">×</button>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="cart-footer">
        <p class="cart-total">Разом: <strong id="cartTotal">0 грн</strong></p>
        <p class="cart-minimum-hint" id="cartMinimumHint" hidden></p>
        <button class="cart-checkout-btn" id="checkoutCartBtn" type="button">Оформити замовлення</button>
        <button class="cart-clear-btn" id="clearCartBtn" type="button">Очистити кошик</button>
      </div>
    </aside>

    <div class="photo-viewer" id="photoViewer" aria-hidden="true" role="dialog" aria-label="Перегляд фото товару">
      <div class="photo-viewer-backdrop" id="photoViewerBackdrop"></div>
      <div class="photo-viewer-body">
        <button class="photo-viewer-close" id="photoViewerClose" type="button" aria-label="Закрити перегляд">×</button>
        <button class="photo-viewer-nav prev" id="photoPrevBtn" type="button" aria-label="Попереднє фото">‹</button>
        <img class="photo-viewer-image" id="photoViewerImage" src="" alt="Фото товару">
        <button class="photo-viewer-nav next" id="photoNextBtn" type="button" aria-label="Наступне фото">›</button>
        <p class="photo-viewer-caption" id="photoViewerCaption"></p>
      </div>
    </div>

    <button class="scroll-down" aria-label="Прокрутити вниз">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <footer class="site-watermark">
      <a class="site-watermark-link" href="https://www.vitryna-shop.com/landing" title="Створити власний магазин на Вітрина">
        <svg class="site-watermark-logo" viewBox="150 240 290 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Вітрина">
          <rect x="150" y="240" width="290" height="290" rx="55" fill="#3B82E0"/>
          <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
            <path d="M215 350 L235 300 L355 300 L375 350"/>
            <path d="M215 350 Q225 372 245 372 Q265 372 275 350"/>
            <path d="M275 350 Q285 372 305 372 Q325 372 335 350"/>
            <path d="M335 350 Q345 372 355 372 Q365 372 375 350"/>
            <line x1="235" y1="372" x2="235" y2="450"/>
            <line x1="355" y1="372" x2="355" y2="450"/>
            <path d="M225 400 L365 400 L365 450 L225 450 Z"/>
            <line x1="205" y1="470" x2="385" y2="470"/>
          </g>
        </svg>
        <span class="site-watermark-text">Створено на <strong>Вітрина</strong></span>
      </a>
    </footer>

  </main>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="firebase-sync.js?v=20260731a"></script>
<script src="script.js?v=20260731d"></script>
</body>
</html>
