<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Реєстрація магазину — Лавка</title>
  <meta name="description" content="Реєстрація магазину в Лавці: телефон, назва, адреса." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #378add;
      --blue-dark: #2b6db1;
      --coral: #f0997b;
      --green: #639922;
      --bg-soft: #e6f1fb;
      --ink: #1b2a3d;
      --gray: #667487;
      --line: #d7e3f2;
      --radius: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
      font-weight: 600;
      color: var(--ink);
      background: var(--bg-soft);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 16px 14px 32px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 18px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--blue);
      text-decoration: none;
      padding: 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #ffffff;
      box-shadow: 0 6px 14px rgba(36, 77, 126, 0.14);
      transition: transform 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
      flex: 0 0 44px;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      background: #f5f9ff;
      border-color: #bfd6ef;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--blue);
      font-weight: 800;
      font-size: 19px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 32px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
    }

    .subhead {
      margin: 0 0 16px;
      color: var(--gray);
      font-size: 14px;
    }

    /* --- Блок порад --- */
    .tips-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, var(--blue) 0%, #4a9be5 100%);
      color: #fff;
      box-shadow: 0 10px 24px rgba(55, 138, 221, 0.24);
    }

    .tips-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 100% 0%, rgba(255,255,255,0.16), transparent 45%),
        radial-gradient(circle at 0% 120%, rgba(240,153,123,0.30), transparent 50%);
      pointer-events: none;
    }

    .tips-top {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tips-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 26px;
    }

    .tips-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .tips-body {
      position: relative;
      min-height: 40px;
    }

    .tip-text {
      position: absolute;
      inset: 0;
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .45s ease, transform .45s ease;
    }

    .tip-text.show {
      position: relative;
      opacity: 1;
      transform: translateY(0);
    }

    .tips-dots {
      position: relative;
      display: flex;
      gap: 5px;
      margin-top: 12px;
    }

    .tips-dots span {
      height: 4px;
      flex: 1;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      overflow: hidden;
    }

    .tips-dots span i {
      display: block;
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 999px;
    }

    .tips-dots span.filled i {
      width: 100%;
      transition: none;
    }

    .tips-dots span.running i {
      width: 100%;
      transition: width linear;
    }
    /* --- /Блок порад --- */

    .register-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }

    .progress {
      display: flex;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .progress-step {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .progress-track {
      position: absolute;
      top: 14px;
      left: -50%;
      width: 100%;
      height: 3px;
      background: #dde8f5;
      z-index: 0;
    }

    .progress-step:first-child .progress-track {
      display: none;
    }

    .progress-step.done .progress-track,
    .progress-step.active .progress-track {
      background: var(--blue);
    }

    .progress-dot {
      position: relative;
      z-index: 1;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #fff;
      border: 2.5px solid #dde8f5;
      color: #9fb2c8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      transition: border-color .2s ease, background-color .2s ease, color .2s ease;
    }

    .progress-step.active .progress-dot {
      border-color: var(--blue);
      color: var(--blue);
      background: #eaf3ff;
    }

    .progress-step.done .progress-dot {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .progress-caption {
      margin: 7px 0 0;
      font-size: 11.5px;
      font-weight: 700;
      color: #9fb2c8;
      line-height: 1.25;
      padding: 0 2px;
    }

    .progress-step.active .progress-caption {
      color: var(--blue);
      font-weight: 800;
    }

    .progress-step.done .progress-caption {
      color: #6c8aab;
    }

    .step-panel {
      display: none;
    }

    .step-panel.active {
      display: block;
    }

    .step-title {
      margin: 0 0 14px;
      font-size: 19px;
      line-height: 1.25;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 13px;
      font-weight: 800;
      color: #3d4f66;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      border-radius: 11px;
      border: 1px solid #ceddee;
      background: #fff;
      padding: 10px 14px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.16);
    }

    .btn {
      border: 0;
      border-radius: 12px;
      min-height: 48px;
      width: 100%;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      padding: 12px 18px;
      transition: transform .14s ease, filter .16s ease;
    }

    .btn:active {
      transform: scale(.985);
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--blue-dark);
    }

    .btn-coral {
      background: var(--coral);
      color: #5a2c17;
    }

    .btn-ghost {
      background: transparent;
      color: var(--gray);
      font-weight: 700;
      font-size: 13px;
      min-height: 34px;
      margin-top: 4px;
    }

    .code-hint {
      border: 1px dashed #c6d8ef;
      border-radius: 12px;
      padding: 10px 12px;
      background: #f5faff;
      margin: -2px 0 12px;
      display: none;
      color: #27476f;
      font-size: 13px;
    }

    .status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 13px;
      font-weight: 700;
      color: #46607f;
    }

    .status.error {
      color: #b33b47;
    }

    .status.success {
      color: #487518;
    }

    .subdomain-preview {
      margin: -2px 0 14px;
      padding: 10px 12px;
      border-radius: 11px;
      background: #f0f7ff;
      border: 1px solid #cfe2f7;
      color: #35567f;
      font-size: 13px;
      font-weight: 700;
      word-break: break-all;
    }

    .registration-time-note {
      margin: 14px 0 0;
      text-align: center;
      color: rgba(72, 89, 112, 0.58);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    @media (min-width: 560px) {
      .page {
        padding-top: 24px;
        padding-bottom: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .register-card {
        padding: 24px;
      }

      .tips-card {
        padding: 20px 22px 18px;
      }

      .tip-text {
        font-size: 15.5px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back-btn" href="landing.html" aria-label="Повернутися назад" title="Повернутися назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </header>

    <h1>Створи магазин</h1>
    <p class="subhead">Три кроки — і магазин готовий</p>

    <div class="tips-card" aria-label="Поради щодо продажів">
      <div class="tips-top">
        <span class="tips-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
        </span>
        <span class="tips-label">Порада</span>
      </div>
      <div class="tips-body" id="tipsBody"></div>
      <div class="tips-dots" id="tipsDots"></div>
    </div>

    <section class="register-card" aria-label="Форма реєстрації">
      <div class="progress" aria-label="Прогрес реєстрації">
        <div class="progress-step active" data-progress="1">
          <span class="progress-track" aria-hidden="true"></span>
          <span class="progress-dot">1</span>
          <p class="progress-caption">Телефон</p>
        </div>
        <div class="progress-step" data-progress="2">
          <span class="progress-track" aria-hidden="true"></span>
          <span class="progress-dot">2</span>
          <p class="progress-caption">Назва магазину</p>
        </div>
        <div class="progress-step" data-progress="3">
          <span class="progress-track" aria-hidden="true"></span>
          <span class="progress-dot">3</span>
          <p class="progress-caption">Ваш піддомен</p>
        </div>
      </div>

      <form id="registrationForm" novalidate>
        <div class="step-panel active" data-step="1">
          <h2 class="step-title">Твій номер телефону</h2>

          <div class="field">
            <label for="phoneInput">Телефон</label>
            <input id="phoneInput" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380XXXXXXXXX" maxlength="16" required />
          </div>

          <div class="code-hint" id="codeBox" aria-live="polite"></div>

          <div class="field" id="codeField" style="display:none;">
            <label for="codeInput">Код із SMS</label>
            <input id="codeInput" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 цифри" required />
          </div>

          <button type="button" class="btn btn-primary" id="sendCodeBtn">Отримати код</button>
          <button type="button" class="btn btn-primary" id="verifyCodeBtn" style="display:none; margin-top:8px;">Підтвердити</button>

          <p class="status" id="step1Status" aria-live="polite"></p>
        </div>

        <div class="step-panel" data-step="2">
          <h2 class="step-title">Назва магазину</h2>

          <div class="field">
            <label for="storeNameInput">Назва</label>
            <input id="storeNameInput" name="storeName" type="text" maxlength="60" placeholder="Смаколики від Олі" required />
          </div>

          <button type="button" class="btn btn-primary" id="toStep3Btn">Далі</button>
          <button type="button" class="btn btn-ghost" id="backToStep1Btn">Назад</button>

          <p class="status" id="step2Status" aria-live="polite"></p>
        </div>

        <div class="step-panel" data-step="3">
          <h2 class="step-title">Адреса магазину</h2>

          <div class="field">
            <label for="subdomainInput">Піддомен</label>
            <input id="subdomainInput" name="subdomain" type="text" maxlength="32" placeholder="miy-magazyn" required />
          </div>

          <div class="subdomain-preview" id="subdomainPreview">https://miy-magazyn.lavka.shop</div>

          <button type="submit" class="btn btn-coral">Завершити</button>
          <button type="button" class="btn btn-ghost" id="backToStep2Btn">Назад</button>

          <p class="status" id="step3Status" aria-live="polite"></p>
        </div>
      </form>
      <p class="registration-time-note">Реєстрація триває не більше 45 сек</p>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="firebase-sync.js"></script>
  <script>
    (function () {
      var STORE_SETTINGS_KEY = "lavkaStoreSettings";
      var REGISTRATION_KEY = "lavkaRegistration";
      var PENDING_PHONE_KEY = "lavkaPendingRegistrationPhone";
      var FIREBASE_CONFIG = {
        apiKey: "AIzaSyDzJ3zOCHvuAnZQA-90va3xZxoBSVqnwLs",
        authDomain: "lavka-shop.firebaseapp.com",
        projectId: "lavka-shop",
        storageBucket: "lavka-shop.firebasestorage.app",
        messagingSenderId: "437450554587",
        appId: "1:437450554587:web:2448c9e6fa0cd9c0d520fe"
      };
      var MAX_STORE_NAME_LENGTH = 60;
      var MIN_SUBDOMAIN_LENGTH = 1;
      var SUBDOMAIN_PATTERN = /^[a-z0-9-]{1,32}$/;
      var currentStep = 1;
      var generatedCode = "";
      var phoneVerified = false;
      var isSubmitting = false;

      var progressItems = Array.from(document.querySelectorAll(".progress-step"));
      var stepPanels = Array.from(document.querySelectorAll(".step-panel"));

      var phoneInput = document.getElementById("phoneInput");
      var codeInput = document.getElementById("codeInput");
      var codeField = document.getElementById("codeField");
      var codeBox = document.getElementById("codeBox");
      var sendCodeBtn = document.getElementById("sendCodeBtn");
      var verifyCodeBtn = document.getElementById("verifyCodeBtn");
      var storeNameInput = document.getElementById("storeNameInput");
      var subdomainInput = document.getElementById("subdomainInput");
      var subdomainPreview = document.getElementById("subdomainPreview");

      var step1Status = document.getElementById("step1Status");
      var step2Status = document.getElementById("step2Status");
      var step3Status = document.getElementById("step3Status");

      var backToStep1Btn = document.getElementById("backToStep1Btn");
      var toStep3Btn = document.getElementById("toStep3Btn");
      var backToStep2Btn = document.getElementById("backToStep2Btn");
      var registrationForm = document.getElementById("registrationForm");
      var submitBtn = registrationForm.querySelector("button[type='submit']");

      function getFirestore() {
        if (!window.firebase) {
          return null;
        }

        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }

        return firebase.firestore();
      }

      function updateProgress() {
        progressItems.forEach(function (item) {
          var step = Number(item.getAttribute("data-progress"));
          var isDone = step < currentStep;
          item.classList.toggle("active", step === currentStep);
          item.classList.toggle("done", isDone);

          var dot = item.querySelector(".progress-dot");
          dot.textContent = isDone ? "✓" : String(step);
        });

        stepPanels.forEach(function (panel) {
          var panelStep = Number(panel.getAttribute("data-step"));
          panel.classList.toggle("active", panelStep === currentStep);
        });
      }

      function setStatus(el, text, kind) {
        el.textContent = text || "";
        el.classList.remove("error", "success");
        if (kind) {
          el.classList.add(kind);
        }
      }

      function normalizePhone(raw) {
        var value = String(raw || "").trim();
        return value.replace(/[^0-9+]/g, "");
      }

      function getIncomingPhoneFromUrl() {
        var params = new URLSearchParams(window.location.search || "");
        return normalizePhone(params.get("phone") || "");
      }

      function getIncomingPhoneFromSession() {
        try {
          return normalizePhone(sessionStorage.getItem(PENDING_PHONE_KEY) || "");
        } catch (error) {
          return "";
        }
      }

      function isValidPhone(phone) {
        return /^\+?\d{10,14}$/.test(phone);
      }

      function sanitizeSubdomain(raw) {
        return String(raw || "")
          .toLowerCase()
          .replace(/[^a-z0-9-]/g, "")
          .replace(/-{2,}/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 32);
      }

      function updateSubdomainPreview() {
        var safe = sanitizeSubdomain(subdomainInput.value) || "miy-magazyn";
        subdomainPreview.textContent = "https://" + safe + ".lavka.shop";
      }

      function normalizeStoreName(raw) {
        return String(raw || "").trim().slice(0, MAX_STORE_NAME_LENGTH);
      }

      function isValidSubdomain(subdomain) {
        return SUBDOMAIN_PATTERN.test(subdomain);
      }

      function setSubmittingState(loading) {
        isSubmitting = loading;
        submitBtn.disabled = loading;
        backToStep2Btn.disabled = loading;
        submitBtn.textContent = loading ? "Реєструємо..." : "Завершити";
      }

      function reserveSubdomainInFirestore(payload) {
        var db = getFirestore();
        if (!db) {
          return Promise.reject(new Error("firestore-unavailable"));
        }

        var fieldValue = firebase.firestore.FieldValue;
        var subdomainRef = db.collection("store_subdomains").doc(payload.subdomain);
        var registryRef = db.collection("stores_registry").doc(payload.subdomain);
        var registrationRef = db.collection("stores").doc(payload.subdomain).collection("data").doc(REGISTRATION_KEY);
        var settingsRef = db.collection("stores").doc(payload.subdomain).collection("data").doc(STORE_SETTINGS_KEY);

        return subdomainRef
          .create({
            subdomain: payload.subdomain,
            storeId: payload.subdomain,
            domain: payload.domain,
            storeName: payload.storeName,
            phone: payload.phone,
            status: "active",
            createdAt: fieldValue.serverTimestamp(),
            updatedAt: fieldValue.serverTimestamp()
          })
          .then(function () {
            var batch = db.batch();
            batch.set(registryRef, {
              storeId: payload.subdomain,
              storeName: payload.storeName,
              domain: payload.domain,
              phone: payload.phone,
              updatedAt: new Date().toISOString()
            }, { merge: true });

            batch.set(registrationRef, {
              key: REGISTRATION_KEY,
              value: {
                phone: payload.phone,
                storeName: payload.storeName,
                subdomain: payload.subdomain,
                domain: payload.domain,
                registeredAt: payload.registeredAt
              },
              updatedAt: new Date().toISOString()
            }, { merge: true });

            batch.set(settingsRef, {
              key: STORE_SETTINGS_KEY,
              value: {
                storeName: payload.storeName,
                domain: payload.domain
              },
              updatedAt: new Date().toISOString()
            }, { merge: true });

            return batch.commit();
          })
          .catch(function (error) {
            var code = String((error && error.code) || "").toLowerCase();
            if (code === "already-exists") {
              var takenError = new Error("subdomain-taken");
              takenError.code = "subdomain-taken";
              throw takenError;
            }
            throw error;
          });
      }

      function wait(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      async function reserveSubdomainWithRetry(payload, retries) {
        var attemptsLeft = typeof retries === "number" ? retries : 2;
        try {
          await reserveSubdomainInFirestore(payload);
        } catch (error) {
          var code = String((error && error.code) || "").toLowerCase();
          var isRetriable = code === "aborted" || code === "unavailable" || code === "deadline-exceeded" || code === "resource-exhausted";
          if (attemptsLeft > 0 && isRetriable) {
            var retryNumber = retries - attemptsLeft + 1;
            await wait(500 * retryNumber);
            return reserveSubdomainWithRetry(payload, attemptsLeft - 1);
          }
          throw error;
        }
      }

      function goToStep(step) {
        currentStep = step;
        updateProgress();
        if (step === 1) {
          phoneInput.focus();
        }
        if (step === 2) {
          storeNameInput.focus();
        }
        if (step === 3) {
          subdomainInput.focus();
        }
      }

      function bootstrapPhoneFromLanding() {
        var incomingPhone = getIncomingPhoneFromUrl() || getIncomingPhoneFromSession();
        if (!incomingPhone || !isValidPhone(incomingPhone)) {
          return;
        }

        phoneInput.value = incomingPhone;

        try {
          sessionStorage.removeItem(PENDING_PHONE_KEY);
        } catch (error) {
          // Ignore sessionStorage cleanup errors in private browsing modes.
        }

        // Auto-start code flow so user can immediately enter SMS code.
        sendCodeBtn.click();

        if (codeInput && codeField.style.display !== "none") {
          codeInput.focus();
        }
      }

      sendCodeBtn.addEventListener("click", function () {
        setStatus(step1Status, "", "");

        var phone = normalizePhone(phoneInput.value);
        phoneInput.value = phone;

        if (!isValidPhone(phone)) {
          setStatus(step1Status, "Введи коректний номер телефону.", "error");
          phoneInput.focus();
          return;
        }

        generatedCode = String(Math.floor(1000 + Math.random() * 9000));
        codeBox.style.display = "block";
        codeBox.textContent = "Демо-код: " + generatedCode;
        codeField.style.display = "grid";
        codeInput.value = "";
        codeInput.focus();
        sendCodeBtn.style.display = "none";
        verifyCodeBtn.style.display = "block";
        setStatus(step1Status, "", "");
      });

      verifyCodeBtn.addEventListener("click", function () {
        setStatus(step1Status, "", "");

        var enteredCode = String(codeInput.value || "").trim();
        if (enteredCode.length !== 4) {
          setStatus(step1Status, "Код має містити 4 цифри.", "error");
          return;
        }

        if (enteredCode !== generatedCode) {
          setStatus(step1Status, "Невірний код. Спробуй ще раз.", "error");
          return;
        }

        phoneVerified = true;
        goToStep(2);
      });

      backToStep1Btn.addEventListener("click", function () {
        goToStep(1);
      });

      storeNameInput.addEventListener("input", function () {
        if (storeNameInput.value.length > MAX_STORE_NAME_LENGTH) {
          storeNameInput.value = storeNameInput.value.slice(0, MAX_STORE_NAME_LENGTH);
        }
      });

      toStep3Btn.addEventListener("click", function () {
        setStatus(step2Status, "", "");

        if (!phoneVerified) {
          setStatus(step2Status, "Підтверди телефон перед продовженням.", "error");
          goToStep(1);
          return;
        }

        var storeName = normalizeStoreName(storeNameInput.value);
        storeNameInput.value = storeName;
        if (storeName.length < 2) {
          setStatus(step2Status, "Вкажи назву магазину.", "error");
          storeNameInput.focus();
          return;
        }

        goToStep(3);
      });

      backToStep2Btn.addEventListener("click", function () {
        goToStep(2);
      });

      subdomainInput.addEventListener("input", function () {
        var safeValue = sanitizeSubdomain(subdomainInput.value);
        if (subdomainInput.value !== safeValue) {
          subdomainInput.value = safeValue;
        }
        updateSubdomainPreview();
      });

      registrationForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (isSubmitting) {
          return;
        }
        setStatus(step3Status, "", "");

        if (!phoneVerified) {
          setStatus(step3Status, "Спочатку підтверди телефон.", "error");
          goToStep(1);
          return;
        }

        var storeName = normalizeStoreName(storeNameInput.value);
        storeNameInput.value = storeName;
        var subdomain = sanitizeSubdomain(subdomainInput.value);
        var phone = normalizePhone(phoneInput.value);

        if (storeName.length < 2) {
          setStatus(step3Status, "Некоректна назва магазину.", "error");
          goToStep(2);
          return;
        }

        if (subdomain.length < MIN_SUBDOMAIN_LENGTH) {
          setStatus(step3Status, "Вкажи піддомен.", "error");
          subdomainInput.focus();
          return;
        }

        if (!isValidSubdomain(subdomain)) {
          setStatus(step3Status, "Піддомен може містити латиницю, цифри та дефіс.", "error");
          subdomainInput.focus();
          return;
        }

        var domain = "https://" + subdomain + ".lavka.shop";
        var registeredAt = new Date().toISOString();
        var payload = {
          phone: phone,
          storeName: storeName,
          subdomain: subdomain,
          domain: domain,
          registeredAt: registeredAt
        };

        try {
          setSubmittingState(true);
          setStatus(step3Status, "Перевіряємо і реєструємо піддомен...", "");
          await reserveSubdomainWithRetry(payload, 3);
        } catch (error) {
          if (error && error.code === "subdomain-taken") {
            setStatus(step3Status, "Цей піддомен вже зайнятий. Спробуй інший.", "error");
          } else if (error && /permission-denied/i.test(String(error.code || ""))) {
            setStatus(step3Status, "Немає доступу до реєстрації піддомену. Перевір правила Firestore.", "error");
          } else if (error && /unavailable|deadline-exceeded/i.test(String(error.code || ""))) {
            setStatus(step3Status, "Тимчасова проблема з підключенням до бази. Спробуй ще раз через кілька секунд.", "error");
          } else {
            setStatus(step3Status, "Не вдалося зареєструвати піддомен. Спробуй ще раз.", "error");
          }
          setSubmittingState(false);
          return;
        }

        var settings = {};
        try {
          settings = JSON.parse(localStorage.getItem(STORE_SETTINGS_KEY) || "{}");
        } catch (err) {
          settings = {};
        }

        settings.storeName = storeName;
        settings.domain = domain;

        localStorage.setItem(STORE_SETTINGS_KEY, JSON.stringify(settings));
        localStorage.setItem(REGISTRATION_KEY, JSON.stringify({
          phone: phone,
          storeName: storeName,
          subdomain: subdomain,
          domain: settings.domain,
          registeredAt: registeredAt
        }));

        setStatus(step3Status, "Готово! Переходимо в адмін-панель...", "success");

        setTimeout(function () {
          window.location.href = "admin.html?store=" + encodeURIComponent(subdomain);
        }, 700);
      });

      updateSubdomainPreview();
      updateProgress();
      bootstrapPhoneFromLanding();
      if (codeField.style.display === "none") {
        phoneInput.focus();
      }
    })();

    // --- Ротація порад ---
    (function () {
      var TIPS = [
        "Додай мінімум 5 фото товару — покупці довіряють магазинам з якісними знімками.",
        "Вказуй чітку ціну і наявність — це прибирає зайві питання в переписках.",
        "Промокод на перше замовлення часто підвищує конверсію на 15–20%.",
        "Відповідай на замовлення протягом 15 хвилин — швидкість продає.",
        "Опис товару у 2-3 реченнях працює краще, ніж довгий текст.",
        "Постав на аватарку логотип або фото — так магазин виглядає надійніше.",
        "Додай соцмережі в налаштуваннях — клієнти люблять перевіряти відгуки.",
        "Раз на тиждень онови вітрину новинками — це підтримує інтерес клієнтів."
      ];

      var ROTATE_MS = 5000;
      var body = document.getElementById("tipsBody");
      var dotsWrap = document.getElementById("tipsDots");
      var index = 0;
      var dots = [];

      TIPS.forEach(function (tip, i) {
        var p = document.createElement("p");
        p.className = "tip-text";
        p.textContent = tip;
        if (i === 0) p.classList.add("show");
        body.appendChild(p);

        var dot = document.createElement("span");
        var bar = document.createElement("i");
        dot.appendChild(bar);
        dotsWrap.appendChild(dot);
        dots.push(dot);
      });

      var texts = Array.from(body.querySelectorAll(".tip-text"));

      function startDot(i) {
        dots.forEach(function (d, di) {
          d.classList.toggle("filled", di < i);
          d.classList.remove("running");
          var bar = d.querySelector("i");
          bar.style.transition = "none";
          bar.style.width = di < i ? "100%" : "0%";
        });
        requestAnimationFrame(function () {
          var activeDot = dots[i];
          var bar = activeDot.querySelector("i");
          activeDot.classList.add("running");
          bar.style.transition = "width " + ROTATE_MS + "ms linear";
          bar.style.width = "100%";
        });
      }

      function showTip(i) {
        texts.forEach(function (t, ti) {
          t.classList.toggle("show", ti === i);
        });
        startDot(i);
      }

      showTip(index);

      setInterval(function () {
        index = (index + 1) % TIPS.length;
        showTip(index);
      }, ROTATE_MS);
    })();
  </script>
</body>
</html>
